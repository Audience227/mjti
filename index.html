<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F4F2EC">
<title>mjti · 测测你是MJ宇宙中的哪一位</title>
<style>
  /* 色调对齐 CatTi：米白纸质极简风 · 近黑 accent · 直角 · 细进度条 */
  :root {
    --page:#F4F2EC; --bg:#F7F5F0; --panel-2:#EDEAE2;
    --border:#D9D6CD;
    --ink-1:#2A2A28; --ink-2:#7C7B76; --ink-3:#9a988f;
    --accent:#2A2A28; --accent-2:#9a988f;
    --on-accent:#F4F2EC;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#cfcdc7; min-height:100vh; display:flex; justify-content:center;
         font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-weight:300; }
  .phone { width:100%; max-width:480px; min-height:100vh; background:var(--page); }
  @media(min-width:561px){ .phone { height:min(880px,100vh); } body { padding:20px; } }
  .screen { display:none; padding:32px 26px 40px; }
  .kicker { font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:var(--accent-2); }
  h1 { color:var(--ink-1); font-size:56px; font-weight:800; letter-spacing:-.02em; margin:16px 0 10px; }
  .home-sub { color:var(--ink-1); font-size:20px; font-weight:600; margin-bottom:30px; }
  .btn { display:block; width:100%; border:none; border-radius:0; padding:16px;
         font-size:17px; font-weight:600; cursor:pointer; font-family:inherit;
         transition:transform .18s cubic-bezier(.16,1,.3,1); }
  .btn:active { transform:scale(.97); }
  .btn-gold { background:var(--accent); color:var(--on-accent); }
  .btn-ghost { background:transparent; border:1px solid var(--ink-1); color:var(--ink-1); margin-top:12px; font-size:15px; padding:14px; }
  .progress { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  #q-progress { color:var(--accent-2); font-weight:600; font-size:13px; letter-spacing:.06em; white-space:nowrap; }
  .bar-wrap { flex:1; height:4px; background:var(--border); border-radius:0; overflow:hidden; }
  #q-bar { height:100%; width:0; background:var(--accent); transition:width .45s cubic-bezier(.16,1,.3,1); }
  #q-text { color:var(--ink-1); font-size:21px; font-weight:600; line-height:1.5; margin-bottom:26px; }
  .opt { display:block; width:100%; text-align:left; background:var(--bg); color:var(--ink-1);
         border:1px solid var(--border); border-radius:0; padding:16px 18px; font-size:15.5px;
         font-weight:400; margin-bottom:14px; cursor:pointer; font-family:inherit; transition:all .15s; }
  .opt:active, .opt:hover { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .shared-tip { background:var(--panel-2); border:1px solid var(--border); color:var(--ink-2);
                border-radius:0; padding:10px 14px; font-size:14px; margin-bottom:18px; }
  .result-card { background:#fff; border-radius:0; overflow:hidden; text-align:center; padding-bottom:22px; border:1px solid var(--border); }
  #r-img { width:62%; margin-top:24px; box-shadow:0 8px 24px rgba(42,42,40,.12); }
  .r-kicker { color:var(--ink-2); font-size:14px; letter-spacing:.2em; margin-top:22px; }
  .r-name { font-size:34px; font-weight:800; color:var(--ink-1); margin-top:6px; letter-spacing:.06em; }
  .r-quote { color:var(--ink-1); font-size:15px; font-weight:600; padding:0 20px; }
  .r-desc { text-align:left; color:var(--ink-1); font-size:15px; line-height:1.8; padding:0 24px; margin-top:12px; font-weight:300; }
  .r-actions { padding:20px 0 0; }
  #r-link { width:100%; border:1px dashed var(--border); border-radius:0; padding:10px; font-size:12px; color:var(--ink-3); text-align:center; background:var(--bg); }
  .note { color:var(--ink-3); font-size:12px; line-height:1.7; margin-top:22px; text-align:center; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="phone">

  <!-- 首页 -->
  <div class="screen" id="screen-home">
    <span class="kicker">24 题 · 4 选 1 · 1 分钟出结果</span>
    <h1>mjti</h1>
    <div class="home-sub">测测你是 MJ 宇宙中的哪一位</div>
    <button class="btn btn-gold" onclick="start()">开始测试</button>
    <div class="note">仅供娱乐</div>
  </div>

  <!-- 答题 -->
  <div class="screen" id="screen-quiz">
    <div class="progress">
      <span id="q-progress">1 / 24</span>
      <div class="bar-wrap"><div id="q-bar"></div></div>
    </div>
    <div id="q-text"></div>
    <div id="q-options"></div>
    <button class="btn btn-ghost" id="btn-prev" onclick="prevQuestion()" style="visibility:hidden">← 上一题</button>
  </div>

  <!-- 结果 -->
  <div class="screen" id="screen-result">
    <div class="shared-tip" id="shared-tip" style="display:none">这是朋友分享给你的结果，测测你自己是哪一位</div>
    <div class="result-card">
      <div class="r-kicker">你的 mjti 是：</div>
      <img id="r-img" src="" alt="结果">
      <div class="r-name" id="r-name"></div>
      <div class="r-quote" id="r-quote"></div>
      <div class="r-desc" id="r-desc"></div>
    </div>
    <div class="r-actions">
      <input id="r-link" readonly>
      <button class="btn btn-gold" style="margin-top:12px" onclick="copyLink()">复制结果链接 · 分享给朋友</button>
      <button class="btn btn-ghost" onclick="start()">再测一次</button>
    </div>
  </div>

</div>
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
